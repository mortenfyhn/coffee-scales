[platformio]
default_envs = release

[env]
monitor_speed = 38400
lib_deps =
    bogde/HX711 @ ^0.7.5
    robtillaart/RunningAverage @ ^0.4.4
    https://github.com/mortenfyhn/arduino-tm1637
build_flags = -std=c++17 -Wall -Wextra -Wno-expansion-to-defined -Werror=unused-result -Werror=overflow
build_src_filter = +<*> -<replay.cpp>

[env:release]
platform = atmelavr
board = feather328p
framework = arduino

[env:logging]
platform = atmelavr
board = feather328p
framework = arduino
build_flags = ${env.build_flags} -D LOGGING

[env:debug]
platform = atmelavr
board = feather328p
framework = arduino
build_flags = ${env.build_flags} -D DEBUG

[env:test]
platform = native
lib_ignore =
    TimerDisplay
    SmoothingFilter
    Hysteresis
    RunningAverage

[env:replay]
platform = native
build_flags = ${env.build_flags} -I host
build_src_filter = +<replay.cpp>
